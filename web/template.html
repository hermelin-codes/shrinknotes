<title>ShrinkNotes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="{{description}}">
<style>
/*__FONTS__*/
/* Layout: one sheet of dotted notebook paper taped to a warm desk; everything else is a pen note around it. */
:root {
  --desk: #f3ead9;
  --paper: #fffaf0;
  --dot: #d9cbb0;
  --ink: #2a2520;
  --pencil: #7a6d5d;
  --pen: #2c57c9;
  --pen-ink: #fffaf0;
  --marker: #ffe36e;
  --tape: rgba(222, 205, 168, .72);
  --shadow: 0 1px 0 rgba(80, 60, 30, .06), 0 10px 24px -12px rgba(80, 60, 30, .35);
  --font-hand: "Shantell Sans", "Comic Neue", "Chalkboard SE", ui-rounded, system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;   /* paper is always paper: one light theme, also when the device is in dark mode */
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--desk); color: var(--ink);
  font-family: var(--font-hand); font-size: 17px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 620px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding-block: 32px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 28px;
}
.mark { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; justify-self: start; color: inherit; text-decoration: none; }
.mark:focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; border-radius: 4px; }
.mark svg { width: 24px; height: 24px; color: var(--pen); }
h1 { font-weight: 800; font-size: clamp(34px, 8vw, 52px); line-height: 1.04; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.hl { background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%); padding: 0 .08em; margin: 0 -.08em; }
.sub { margin: 10px 0 0; color: var(--pencil); font-size: 17px; }

/* ---- the sheet */
.sheet {
  position: relative; align-self: start;
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.3px, transparent 1.6px);
  background-size: 20px 20px; background-position: 10px 10px;
  border-radius: 4px; box-shadow: var(--shadow);
  transform: rotate(-0.7deg);
  transition: transform .2s ease;
}
.sheet::before, .sheet::after {
  content: ""; position: absolute; width: 92px; height: 26px; background: var(--tape);
  top: -12px; border-radius: 2px;
}
.sheet::before { left: 18px; transform: rotate(-6deg); }
.sheet::after { right: 18px; transform: rotate(5deg); }
.sheet.over { transform: rotate(0deg) scale(1.01); }

#drop {
  display: grid; place-items: center; text-align: center; align-content: center; gap: 12px;
  min-height: 280px; padding: 36px 20px; cursor: pointer; border-radius: 4px;
}
#drop:focus-within { outline: 3px solid var(--pen); outline-offset: 4px; }
.big { font-weight: 800; font-size: 26px; line-height: 1.15; }
.small { color: var(--pencil); font-size: 15px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--pencil); font-size: 15px; background: var(--paper); padding: 0 6px; }
.or::before, .or::after { content: ""; width: 26px; height: 2px; border-radius: 2px; background: var(--dot); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn {
  appearance: none; border: 2px solid var(--ink); cursor: pointer;
  font: 600 16px/1 var(--font-hand); min-height: 48px; padding: 12px 22px;
  border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;   /* hand-drawn outline */
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: var(--ink);
  transition: transform .12s ease;
}
.btn:hover { transform: rotate(-1.5deg); }
.btn:focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; }
.btn-pen { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.fake { pointer-events: none; }
.link { appearance: none; background: none; border: 0; padding: 6px 2px; cursor: pointer; font: inherit; color: var(--pencil); text-decoration: underline; text-decoration-style: wavy; text-underline-offset: 4px; }
.link:hover { color: var(--ink); }
.link:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 4px; }

.panel { display: grid; gap: 18px; padding: 36px 26px 30px; min-height: 280px; align-content: center; }
.fname { font-size: 15px; color: var(--pencil); overflow-wrap: anywhere; margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* progress = a pen line being drawn */
.line { width: 100%; height: 26px; display: block; overflow: visible; }
.line .ink { stroke: var(--pen); }
.status { display: flex; justify-content: space-between; gap: 12px; color: var(--pencil); font-size: 15px; }

.result { font-weight: 800; font-size: clamp(30px, 8vw, 46px); line-height: 1.1; letter-spacing: -0.02em; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.result s { color: var(--pencil); font-weight: 600; text-decoration-color: var(--pen); text-decoration-thickness: 3px; }
.result .arrow { color: var(--pen); font-weight: 600; }
.smaller { margin: 0; font-size: 19px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.note { color: var(--pencil); font-size: 15px; }
.err { margin: 0; font-size: 18px; }
.err a { color: var(--pen); text-decoration: underline; text-underline-offset: 3px; }
.err a:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 3px; }

/* ---- several files */
.files { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.row { display: grid; gap: 4px; }
.row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.row-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.row-info { color: var(--pencil); font-size: 15px; font-variant-numeric: tabular-nums; }
.row .line { height: 14px; }
.row[data-state="done"] .line, .row[data-state="error"] .line { display: none; }
.row[data-state="waiting"] .row-name { color: var(--pencil); font-weight: 400; }
.row[data-state="error"] .row-info { color: var(--ink); }
.row-save { font-size: 15px; padding: 2px 0; }
.multi-sum { margin: 0; font-size: 19px; }

/* ---- footer */
footer { display: grid; gap: 8px; color: var(--pencil); font-size: 14px; }
footer a { color: inherit; text-decoration: underline; text-decoration-color: var(--dot); text-underline-offset: 3px; }
footer a:hover { color: var(--ink); text-decoration-color: currentColor; }
footer a:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 3px; }
details { max-width: 56ch; }
summary { cursor: pointer; width: fit-content; text-decoration: underline; text-decoration-style: wavy; text-underline-offset: 4px; }
summary:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
details p { margin: 8px 0 0; }
details h3 { font-size: 15px; font-weight: 600; color: var(--ink); margin: 14px 0 0; }
details h3 + p { margin-top: 2px; }
.more a { margin-right: 2px; }

/* ---- notes below the sheet (topic pages) */
.notes { max-width: 60ch; min-width: 0; }   /* min-width: lets a wide table scroll instead of widening the page */
.notes h2 { font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; margin: 30px 0 8px; text-wrap: balance; }
.notes h2:first-child { margin-top: 4px; }
.notes h3 { font-weight: 600; font-size: 17px; margin: 18px 0 2px; }
.notes p, .notes ul, .notes ol { margin: 0 0 12px; }
.notes ul, .notes ol { padding-left: 1.3em; }
.notes li { margin-bottom: 6px; }
.notes li::marker { color: var(--pen); font-weight: 600; }
.notes a { color: var(--pen); text-decoration: underline; text-underline-offset: 3px; }
.notes a:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 3px; }
.table { overflow-x: auto; margin: 4px 0 14px; }
.notes table { border-collapse: collapse; min-width: 540px; font-size: 15px; line-height: 1.4; }
.notes th, .notes td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 2px dotted var(--dot); }
.notes thead th { font-weight: 800; }
.notes tbody th { font-weight: 600; color: var(--pencil); }
.notes td:last-child { font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .sheet, .sheet.over { transform: none; }
}
</style>

<main class="wrap">
  <a class="mark" href="{{homeHref}}">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 20c4-9 7-12 9-10s-3 9 0 9 6-12 9-11 1 8 6 8" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    ShrinkNotes
  </a>

  <header>
    <h1>{{h1}}</h1>
    <p class="sub">{{sub}}</p>
  </header>

  <section id="sheet" class="sheet" aria-live="polite">
    <div id="view-idle">
      <label id="drop" for="file">
        <input id="file" class="sr" type="file" accept="application/pdf,.pdf" multiple>
        <span class="big">{{drop}}</span>
        <span class="or" aria-hidden="true">{{or}}</span>
        <span class="btn btn-pen fake" aria-hidden="true">{{choose}}</span>
      </label>
    </div>

    <div id="view-work" class="panel" hidden>
      <p id="work-name" class="fname"></p>
      <svg class="line" viewBox="0 0 400 26" preserveAspectRatio="none" role="progressbar" id="bar" aria-label="{{progress}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <clipPath id="bar-clip"><rect id="bar-fill" x="-6" y="-10" width="0" height="46"/></clipPath>
        <path class="ink" clip-path="url(#bar-clip)" d="M3 14 C 60 4, 110 22, 170 13 S 290 6, 397 14" fill="none" stroke-width="4.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="status"><span id="phase">{{reading}}</span><span id="pct" class="mono">0%</span></div>
    </div>

    <div id="view-done" class="panel" hidden>
      <p id="done-name" class="fname"></p>
      <p class="result"><s id="done-before"></s><span class="arrow" aria-label="{{to}}">→</span><span id="done-after"></span></p>
      <p class="smaller"><span id="done-saving" class="hl"></span> <span id="done-detail" class="note"></span></p>
      <div class="actions">
        <button id="save" class="btn btn-pen" type="button">{{savePdf}}</button>
        <button id="again" class="link" type="button">{{again}}</button>
        <span id="save-note" class="note" role="status"></span>
      </div>
    </div>

    <div id="view-multi" class="panel" hidden>
      <ul id="multi-list" class="files"></ul>
      <p id="multi-sum" class="multi-sum" hidden></p>
      <div class="actions">
        <button id="save-all" class="btn btn-pen" type="button" hidden>{{saveAll}}</button>
        <button id="again-multi" class="link" type="button" hidden>{{shrinkMore}}</button>
        <span id="multi-note" class="note" role="status"></span>
      </div>
    </div>

    <div id="view-error" class="panel" hidden>
      <p id="error-msg" class="err"></p>
      <div class="actions"><button id="retry" class="btn" type="button">{{tryAnother}}</button></div>
    </div>
  </section>

<!--__ARTICLE__-->

  <footer>
    <details>
      <summary>{{howSummary}}</summary>
      <p>{{howP1}}</p>
      <p>{{howP2}}</p>
    </details>
<!--__FAQ__-->
    <details>
      <summary>{{privacySummary}}</summary>
      <p>{{privacyP1}}</p>
      <p>{{privacyP2}}</p>
    </details>
<!--__NAV__-->
    <span>{{free}} <a href="https://github.com/hermelin-codes/shrinknotes" target="_blank" rel="noopener">{{github}}</a> · {{notAffiliated}} · <!--__LANG__--></span>
  </footer>
</main>
<template id="row-tpl">
  <li class="row" data-state="waiting">
    <div class="row-top"><span class="row-name"></span><span class="row-info">{{waiting}}</span></div>
    <svg class="line" viewBox="0 0 400 14" preserveAspectRatio="none" aria-hidden="true">
      <clipPath><rect x="-6" y="-10" width="0" height="34"/></clipPath>
      <path class="ink" d="M3 8 C 80 3, 150 12, 220 7 S 330 4, 397 8" fill="none" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
  </li>
</template>
<script>/*__APP__*/</script>
